<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Bãi Xe Cũ">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bãi Xe Cũ</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#63b048;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100vw;height:100vh;touch-action:none;display:block}
button{font-family:inherit;cursor:pointer}
#hud{position:fixed;top:0;left:0;right:0;height:52px;background:linear-gradient(#4a505a,#363b43);display:flex;align-items:center;gap:5px;padding:4px 6px;color:#fff;font-weight:800;font-size:12px;z-index:5;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.pill{background:#1f2328;border-radius:14px;padding:3px 7px;display:flex;align-items:center;gap:4px;height:30px;white-space:nowrap}
.plus{background:linear-gradient(#ffd54a,#f5a000);color:#3a2a00;border-radius:8px;width:22px;height:22px;border:0;font-size:16px;font-weight:900;padding:0;line-height:1;box-shadow:0 2px 0 #8a5a00}
.xpb{width:34px;height:8px;background:#0006;border-radius:4px;overflow:hidden}.xpb i{display:block;height:100%;width:0;background:#38c8ff}
.sb{position:fixed;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe27a,#f5a000);border:3px solid #8a5a00;box-shadow:0 3px 0 #5e3d00,0 4px 8px rgba(0,0,0,.35);font-size:22px;z-index:4;padding:0;line-height:1}
.sb small{display:block;font-size:9px;font-weight:800;color:#3a2a00;margin-top:1px}
.sb:active,#bar button:active{transform:translateY(2px)}
.sb.on::after{content:'!';position:absolute;top:-7px;left:-5px;background:#e53935;color:#fff;border-radius:50%;width:20px;height:20px;font-size:13px;font-weight:900;line-height:20px;border:2px solid #fff}
.zb{position:fixed;left:8px;width:38px;height:38px;border-radius:50%;background:#2c3139cc;color:#fff;border:2px solid #fff6;font-size:22px;z-index:4;padding:0}
#bar{position:fixed;left:0;right:0;bottom:0;height:76px;background:linear-gradient(#4a505a,#2f343b);display:flex;gap:6px;padding:6px;z-index:5}
#bar button{flex:1;background:linear-gradient(#ffd54a,#f5a000);border:3px solid #8a5a00;border-radius:12px;font-size:22px;font-weight:800;padding:0;line-height:1.1;box-shadow:0 3px 0 #5e3d00;position:relative}
#bar small{display:block;font-size:10px;color:#3a2a00;font-weight:800}
#bar button.on::after{content:'!';position:absolute;top:-8px;right:-3px;background:#e53935;color:#fff;border-radius:50%;width:20px;height:20px;font-size:13px;line-height:20px;border:2px solid #fff}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:10}
#box{background:#fff8e6;border-radius:16px;width:92%;max-width:430px;max-height:80vh;overflow:auto;padding:14px;border:4px solid #b57d00;touch-action:pan-y}
#box h3{margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.x{background:#e53935;color:#fff;border:0;border-radius:8px;width:30px;height:30px;font-size:16px}
.row{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #e6d9b5}
.inf{flex:1;font-size:14px}.inf small{color:#666}
.bt{display:flex;flex-direction:column;gap:4px}
.sw{width:30px;height:30px;border-radius:8px;border:2px solid #333}
.b{background:#43a047;color:#fff;border:0;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:800;box-shadow:0 2px 0 #1f6b2a}
.b.off{background:#aaa;box-shadow:none}
.b.big{width:100%;padding:12px;font-size:15px;background:#e8761c;box-shadow:0 2px 0 #a04c0a;margin-bottom:6px}
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:8px 14px;border-radius:12px;font-size:14px;z-index:20;display:none;max-width:90%;text-align:center}
#tut{position:fixed;left:66px;top:136px;background:#fff;color:#222;border:3px solid #e8761c;border-radius:12px;padding:6px 10px;font-size:13px;font-weight:800;z-index:6;max-width:190px;animation:bn 1s infinite alternate}
@keyframes bn{from{transform:translateX(0)}to{transform:translateX(8px)}}
#wh{width:160px;height:160px;border-radius:50%;margin:10px auto;border:6px solid #b57d00;background:conic-gradient(#e53935 0 60deg,#fdd835 0 120deg,#43a047 0 180deg,#1e88e5 0 240deg,#8e24aa 0 300deg,#fb8c00 0 360deg)}
</style></head><body>
<canvas id="cv"></canvas>
<div id="hud">
 <div id="vip" class="pill">👑</div>
 <div class="pill">⭐<b id="lv">1</b><div class="xpb"><i id="xpf"></i></div></div>
 <div class="pill">💵<b id="mo"></b><button class="plus" onclick="go(mShop)">+</button></div>
 <div class="pill">💎<b id="ge"></b><button class="plus" onclick="go(mShop)">+</button></div>
 <button class="plus" style="margin-left:auto;width:28px;height:28px;background:#9aa0aa;box-shadow:0 2px 0 #555" onclick="go(mSet)">⚙</button>
</div>
<button class="sb" id="b_w" style="left:6px;top:62px" onclick="toast(S.wSun?'☀️ Trời nắng: khách đông gấp đôi.':'🌧 Trời mưa: khách ít hơn.')">☀️<small id="wt"></small></button>
<button class="sb" id="b_s" style="left:6px;top:124px" onclick="go(mStaff)">👩<small>Nhân viên</small></button>
<button class="sb" id="b_q" style="left:6px;top:186px" onclick="go(mQuest)">📋<small>Nhiệm vụ</small></button>
<button class="sb" id="b_d" style="left:6px;top:248px" onclick="go(mDaily)">🎁<small>Quà ngày</small></button>
<button class="sb" id="b_wh" style="right:6px;top:62px" onclick="go(mWheel)">🎡<small>Vòng quay</small></button>
<button class="sb" id="b_auct" style="right:6px;top:124px" onclick="go(mAuct)">🚚<small id="at"></small></button>
<button class="sb" id="b_sh" style="right:6px;top:186px" onclick="go(mShop)">🏪<small>Cửa hàng</small></button>
<button class="sb" id="b_g" style="right:6px;top:248px" onclick="go(mGarage)">🚗<small id="cc"></small></button>
<button class="zb" style="bottom:136px" onclick="zoomAt(innerWidth/2,innerHeight/2,cam.z*1.2)">+</button>
<button class="zb" style="bottom:90px" onclick="zoomAt(innerWidth/2,innerHeight/2,cam.z/1.2)">−</button>
<div id="tut">👉 Bấm vào đây để thuê nhân viên làm mọi việc!</div>
<div id="bar">
 <button onclick="go(mMap)">🗺<small>Mở rộng</small></button>
 <button id="b_t" onclick="go(mTrade)">🔄<small>Đổi xe</small></button>
 <button style="flex:1.3;font-size:24px" onclick="useLeaf()">📰<small id="lf"></small></button>
 <button onclick="go(mUp)">🛠<small>Nâng cấp</small></button>
 <button onclick="go(mProfile)">👑<small>VIP</small></button>
</div>
<div id="modal" onclick="if(event.target==this)closeM()"><div id="box"><h3><span id="mt"></span><button class="x" onclick="closeM()">✕</button></h3><div id="mb"></div></div></div>
<div id="toast"></div>
<script>
/* ===================== TIỆN ÍCH ===================== */
const $=id=>document.getElementById(id);
const fmt=n=>n>=1e9?(n/1e9).toFixed(1)+'B':n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e4?(n/1e3).toFixed(1)+'K':Math.round(n).toLocaleString('en-US');
const tm=s=>{s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const R=(a,b)=>a+Math.random()*(b-a),RI=(a,b)=>Math.floor(R(a,b+1)),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),pick=a=>a[RI(0,a.length-1)];

/* ===================== DỮ LIỆU ===================== */
const MD=[
 {n:"Mini",v:8000,L:1.3,W:.8,bh:9,cl:.8,ch:8,co:-.05},
 {n:"Beetle",v:9000,L:1.35,W:.82,bh:8,cl:.85,ch:10,co:0},
 {n:"Corolla",v:13000,L:1.6,W:.84,bh:9,cl:.9,ch:8,co:-.1},
 {n:"Civic",v:14000,L:1.6,W:.84,bh:8,cl:.95,ch:8,co:-.05},
 {n:"Golf",v:15000,L:1.5,W:.82,bh:9,cl:1,ch:8,co:-.15},
 {n:"Mazda 3",v:16000,L:1.6,W:.84,bh:8,cl:.9,ch:8,co:-.1},
 {n:"Camry",v:22000,L:1.75,W:.88,bh:9,cl:1,ch:8,co:-.1},
 {n:"BMW 3",v:32000,L:1.75,W:.88,bh:9,cl:.95,ch:8,co:-.1},
 {n:"Mustang",v:40000,L:1.8,W:.9,bh:8,cl:.8,ch:7,co:-.2},
 {n:"Audi A6",v:45000,L:1.85,W:.9,bh:9,cl:1.05,ch:8,co:-.1},
 {n:"Porsche",v:80000,L:1.7,W:.9,bh:7,cl:.75,ch:7,co:-.1}];
const CL=["#f2c200","#d93a3a","#2a6fdb","#eeeeee","#2b2b2b","#2aa84a","#e8761c","#8a4fd0","#e86fa8"];
const PH=["Xe này đẹp quá!","Giá được không nhỉ?","Ôi! Sao hời thế này?","Cho tôi xem xe này!","Xe còn tốt không?","Tôi lấy chiếc này!"];
const FULL_MONEY=99999999,FULL_GEMS=9999;
const DRV=8.05,ROADY=11.6,APRON=10.55,DOORX=10.7,RX=10.6,TRUCKX=4.2;
const sx=i=>1.9+(i%3)*2,sy=i=>2+Math.floor(i/3)*2.4,ry=i=>2+i*2.4;
const STF=[
 ['buyer','🛒','Nhân viên thu mua','Tự mua xe ở bãi đấu giá và nhận xe khách bán.',15000,2],
 ['mech','🔧','Thợ máy','Tự lấy xe hỏng ra sửa, sửa nhanh gấp đôi khi có thợ.',12000,3],
 ['stage','🅿️','Nhân viên trưng bày','Tự đưa xe đã sửa ra bãi trưng bày.',10000,2],
 ['sales','💼','Nhân viên bán hàng','Tự đến chốt giá với khách đang chờ.',12000,3],
 ['mkt','📰','Nhân viên quảng cáo','Tự phát tờ rơi để kéo khách.',8000,1],
 ['asst','📋','Trợ lý','Tự nhận nhiệm vụ, quà ngày và quay vòng quay.',20000,1]];
const ICON={buyer:'🛒',mech:'🔧',stage:'🅿️',sales:'💼',mkt:'📰',asst:'📋'};
const LOOK={buyer:{shirt:'#2a6fdb',hair:'#2b1d12',skin:'#f1c9a0',hat:'#1d4fa8'},mech:{shirt:'#e8761c',hair:'#5a3a1e',skin:'#e0ac80',hat:'#ffd23a'},stage:{shirt:'#2aa84a',hair:'#111111',skin:'#f1c9a0',hat:'#1f7a38'},sales:{shirt:'#f4f4f4',hair:'#c9a227',skin:'#f1c9a0',hat:null,tie:'#d93a3a'},mkt:{shirt:'#e86fa8',hair:'#111111',skin:'#e0ac80',hat:null},asst:{shirt:'#8a4fd0',hair:'#5a3a1e',skin:'#f1c9a0',hat:null}};
const HOME={buyer:[[3.2,10.5],[2.2,10.5]],mech:[[RX+1.05,ry(0)+.15],[RX+1.05,ry(1)+.15],[RX+1.05,ry(2)+.15]],stage:[[9.1,10.5],[8.6,9.7]],sales:[[6.4,9.3],[5.6,9.3],[4.8,9.3]],mkt:[[1.4,10.5]],asst:[[7.1,9.9]]};

/* ===================== TRẠNG THÁI ===================== */
const def=()=>({money:FULL_MONEY,gems:FULL_GEMS,lv:1,xp:0,vip:false,leaf:10,leafT:0,cars:[],nid:1,saleN:6,repN:2,cap:10,sign:0,deco:0,tools:0,spd:0,staff:{buyer:0,mech:0,stage:0,sales:0,mkt:0,asst:0},auct:[],auctT:1.5,trade:[],tradeT:30,wSun:true,wLeft:300,spinT:0,daily:0,quests:[],stat:{sold:0,profit:0},cT:3,snd:true,tut:false});
function load(){try{const s=JSON.parse(localStorage.getItem('ucb2'));if(s&&s.cars){const d=Object.assign(def(),s);d.staff=Object.assign(def().staff,s.staff);return d}}catch(e){}return def()}
let S=load(),nosave=false,curM=null,cust=[],G=[],parts=[],W=[],wrot=0,wres='',AC=null;
const T={x:-7,st:'away',t:0};
S.money=Math.max(S.money,FULL_MONEY);S.gems=Math.max(S.gems,FULL_GEMS);
const xpN=()=>100+S.lv*60;
const curVal=c=>c.v*(1-.18*c.d);
const ask=c=>Math.round(curVal(c)*(1+.05*S.sign+.03*S.deco)*(S.vip?1.15:1));
const repCost=c=>Math.round(c.v*.07*c.d*(1-.05*S.tools));
const quick=c=>Math.round(curVal(c)*.75);
function mkCar(o){const c={id:o.id,mi:o.mi,col:o.col,v:o.v,d:o.d,cost:o.cost||0,st:o.st||'inv',slot:o.slot==null?-1:o.slot,p:o.p||0,rt:o.rt||0,offer:0,x:DOORX,y:9.9,dir:'y',fwd:1,after:'inv',path:null,claim:false,worker:false};
 if(c.st=='sale'){if(c.slot<0||c.slot>=9)c.st='inv';else{c.x=sx(c.slot);c.y=sy(c.slot)}}
 if(c.st=='rep'){if(c.slot<0||c.slot>=3)c.st='inv';else{c.x=RX;c.y=ry(c.slot);if(!c.rt)c.rt=Math.max(1,c.d)*7}}
 if(c.st=='inv'||c.st=='move')c.st='inv',c.slot=-1;return c}
S.cars=S.cars.map(mkCar);
S.auct.forEach(a=>a.claim=false);S.trade.forEach(a=>a.claim=false);
if(S.auct.length){T.st='park';T.x=TRUCKX}
function genCar(){const mi=RI(0,Math.min(MD.length-1,2+Math.floor(S.lv/2)));return{id:S.nid++,mi,col:pick(CL),v:Math.round(MD[mi].v*R(.9,1.2)/100)*100,d:RI(0,3)}}
function genAuct(){return Array.from({length:4},()=>{const c=genCar();c.price=Math.round(c.v*(.7-.12*c.d)*R(.95,1.05));return c})}
function genTrade(){const c=genCar();c.price=Math.round(c.v*(.6-.12*c.d)*R(.95,1.05));return c}
function genQuests(){const L=S.lv;return[{t:'sell',txt:'Bán xe',need:3+Math.floor(L/2),have:0,rw:{gems:2}},{t:'repair',txt:'Sửa xe',need:2+Math.floor(L/3),have:0,rw:{money:3000*L}},{t:'profit',txt:'Kiếm lợi nhuận',need:4000*L,have:0,rw:{gems:3}}]}
if(!S.quests.length)S.quests=genQuests();
function ev(t,n=1){S.quests.forEach(q=>{if(q.t==t&&!q.done)q.have=Math.min(q.need,q.have+n)})}
function addXp(n){S.xp+=n;while(S.xp>=xpN()){S.xp-=xpN();S.lv++;S.gems+=2;toast('⭐ Lên cấp '+S.lv+'! Nhận 2💎')}}
function save(){if(nosave)return;try{const o=Object.assign({},S);
 o.cars=S.cars.map(c=>({id:c.id,mi:c.mi,col:c.col,v:c.v,d:c.d,cost:c.cost,st:c.st=='move'?c.after:c.st,slot:c.slot,p:c.p,rt:c.rt}));
 const pa=a=>({id:a.id,mi:a.mi,col:a.col,v:a.v,d:a.d,price:a.price});o.auct=S.auct.map(pa);o.trade=S.trade.map(pa);
 localStorage.setItem('ucb2',JSON.stringify(o))}catch(e){}}

/* ===================== ÂM THANH ===================== */
addEventListener('pointerdown',()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume()}catch(e){}});
function snd(f,d=.12,t='sine',v=.07){if(!S.snd||!AC)return;try{const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}

/* ===================== GIAO DIỆN (MODAL) ===================== */
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',2200)}
function modal(t,h){$('mt').textContent=t;$('mb').innerHTML=h;$('modal').style.display='flex'}
function closeM(){$('modal').style.display='none';curM=null}
function go(f){curM=f;f()}
function R_(){hud();if(curM&&$('modal').style.display=='flex')curM()}
const btn=(l,f,ok,c='')=>`<button class="b ${c}${ok?'':' off'}" ${ok?`onclick="${f}"`:''}>${l}</button>`;
const rw=r=>(r.gems?r.gems+'💎 ':'')+(r.money?fmt(r.money)+'💵':'');
const carRow=(c,extra,b)=>`<div class="row"><div class="sw" style="background:${c.col}"></div><div class="inf"><b>${MD[c.mi].n}</b> · hư ${c.d}/3<br><small>${extra}</small></div><div class="bt">${b}</div></div>`;
function urow(k,name,desc,cost,mx,st=1,verb='Nâng cấp'){const full=S[k]>=mx;return `<div class="row"><div class="inf"><b>${name}</b><br><small>${desc}</small></div><div class="bt">${full?'Tối đa':btn(verb+' '+fmt(cost),`up('${k}',${cost},${mx},${st})`,S.money>=cost)}</div></div>`}
function up(k,c,mx,st){if(S[k]>=mx||S.money<c)return;S.money-=c;S[k]+=st;R_()}

function mGarage(){let h=`<p><small>Số xe: ${S.cars.length}/${S.cap}. Nhân viên sẽ tự xử lý xe, bạn cũng có thể tự làm.</small></p>`;
 if(!S.cars.length)h+='<p>Kho trống. Hãy mua xe ở bãi đấu giá (xe tải) hoặc ở mục Đổi xe.</p>';
 S.cars.forEach(c=>{const st=c.st=='sale'?'Đang trưng bày':c.st=='rep'?'Đang sửa '+Math.round(c.p*100)+'%':c.st=='move'?'Đang di chuyển':'Trong kho';let b='';
  if(c.st=='inv'){if(c.d>0)b+=btn('Sửa '+fmt(repCost(c)),`repairBtn(${c.id})`,S.money>=repCost(c));b+=btn('Trưng bày',`displayBtn(${c.id})`,true)+btn('Bán nhanh '+fmt(quick(c)),`quickSell(${c.id})`,true)}
  h+=carRow(c,`Giá trị ${fmt(curVal(c))} · ${st}`,b)});modal('🚗 Kho xe',h)}
function launch(c,after,slot){c.st='move';c.after=after;c.slot=slot;c.x=DOORX;c.y=9.9;c.dir='y';c.fwd=1;c.offer=0;
 const p=[[DOORX,APRON],[DRV,APRON]];
 if(after=='sale'){const y=sy(slot),a=y+1.2;p.push([DRV,a],[sx(slot),a],[sx(slot),y])}
 else{const y=ry(slot),a=y+1.2;p.push([DRV,a],[RX,a],[RX,y])}
 c.path=p}
function toGarage(c){const a0=(c.st=='sale'?sy(c.slot):ry(c.slot))+1.2,x0=c.st=='sale'?sx(c.slot):RX;
 c.st='move';c.after='inv';c.slot=-1;c.offer=0;c.worker=false;c.path=[[x0,a0],[DRV,a0],[DRV,APRON],[DOORX,APRON],[DOORX,9.9]]}
function freeSale(){for(let i=0;i<S.saleN;i++)if(!S.cars.some(c=>(c.st=='sale'||c.st=='move'&&c.after=='sale')&&c.slot==i))return i;return -1}
function freeBay(){for(let i=0;i<S.repN;i++)if(!S.cars.some(c=>(c.st=='rep'||c.st=='move'&&c.after=='rep')&&c.slot==i))return i;return -1}
function sendRepair(c,b){const cost=repCost(c);if(S.money<cost)return false;S.money-=cost;c.cost+=cost;c.p=0;c.rt=c.d*7;c.claim=false;launch(c,'rep',b);return true}
function sendDisplay(c,i){c.claim=false;launch(c,'sale',i)}
function repairBtn(id){const c=S.cars.find(c=>c.id==id);if(!c||c.st!='inv')return;const b=freeBay();if(b<0)return toast('Xưởng đang đầy. Mở thêm ô sửa xe ở mục Mở rộng.');if(!sendRepair(c,b))return toast('Không đủ tiền.');R_()}
function displayBtn(id){const c=S.cars.find(c=>c.id==id);if(!c||c.st!='inv')return;const i=freeSale();if(i<0)return toast('Hết ô trưng bày. Mở thêm ở mục Mở rộng.');sendDisplay(c,i);R_()}
function quickSell(id){const i=S.cars.findIndex(c=>c.id==id),c=S.cars[i];if(!c||c.st!='inv')return;const p=quick(c);S.money+=p;S.cars.splice(i,1);toast('Bán nhanh '+MD[c.mi].n+' +'+fmt(p));R_()}

 if(T.st!='park')return toast('Xe tải chưa tới nơi.');if(S.cars.length>=S.cap)return toast('Kho đầy. Hãy mở rộng kho.');if(S.money<a.price)return toast('Không đủ tiền.');
 const x=truckCarX(i);S.money-=a.price;S.auct.splice(i,1);

 S.cars.push(c);ev('buy');snd(400,.08,'square');R_()}

 if(S.cars.length>=S.cap)return toast('Kho đầy.');if(S.money<a.price)return toast('Không đủ tiền.');
 S.money-=a.price;S.trade.splice(i,1);
 const c=mkCar({id:a.id,mi:a.mi,col:a.col,v:a.v,d:a.d,cost:a.price});c.st='move';c.after='inv';c.x=1.4;c.y=10.85;c.dir='x';c.fwd=1;c.path=[[1.4,APRON],[DOORX,APRON],[DOORX,9.9]];
 S.cars.push(c);ev('buy');R_()}

 let h='<p><small>Nhân viên tự làm mọi việc: mua xe, sửa xe, trưng bày, bán xe, phát tờ rơi và nhận thưởng. Bạn chỉ cần nhìn bãi chạy.</small></p>';

 [[5,2000],[20,9000],[50,25000]].map(([g,m])=>`<div class="row"><div class="inf"><b>${fmt(m*S.lv)}💵</b></div><div class="bt">${btn(g+'💎',`exch(${g},${m*S.lv})`,S.gems>=g)}</div></div>`).join('')+

 S.leaf--;for(let i=0;i<3;i++)spawnCust();if(!auto)toast('📰 Khách đang kéo đến!');hud()}

function spawnCust(){if(cust.length>=S.saleN+3)return;const t=S.cars.filter(c=>c.st=='sale'&&!c.offer&&!cust.some(k=>k.car==c.id));if(!t.length)return;const c=pick(t);
 cust.push({x:R(-1,2),y:10.5,car:c.id,st:'walk',tt:0,pat:0,hp:0,walking:true,shirt:pick(CL),hair:pick(['#2b1d12','#5a3a1e','#c9a227','#9a9a9a','#111111']),skin:pick(['#f1c9a0','#e0ac80','#a9734a']),say:'',sayT:0})}
function sell(c,price){if(!S.cars.includes(c)||c.st!='sale')return;const profit=price-c.cost;
 S.money+=price;S.stat.sold++;S.stat.profit+=Math.max(0,profit);ev('sell');ev('profit',Math.max(0,profit));addXp(15+Math.max(0,Math.round(profit/200)));
 S.cars.splice(S.cars.indexOf(c),1);
 const k=cust.find(k=>k.car==c.id);if(k){k.st='happy';k.hp=1.3;k.say='Cảm ơn nhé!';k.sayT=2}
 const a=c.y+1.2;G.push({mi:c.mi,col:c.col,x:c.x,y:c.y,dir:'y',fwd:1,path:[[c.x,a],[DRV,a],[DRV,ROADY],[-9,ROADY]]});
 burst(c.x,c.y,price);snd(880,.1,'triangle');setTimeout(()=>snd(1320,.14,'triangle'),90);R_()}

/* ===================== NHÂN VIÊN ===================== */
function rebuildStaff(){Object.keys(S.staff).forEach(k=>{const have=W.filter(w=>w.k==k).length;
 for(let i=have;i<S.staff[k];i++)W.push(Object.assign({k,x:-4,y:10.5,home:HOME[k][i]||HOME[k][0],job:null,idleT:.5,tt:Math.random()*5,say:'',sayT:0,cd:0,at:2,walking:false,working:false},LOOK[k]))})}
const wSpd=()=>2.1*(1+.35*S.spd);
function mv(o,dx,dy,d,s){o.x+=dx/d*Math.min(s,d);o.y+=dy/d*Math.min(s,d);o.walking=true}
function wupdate(w,dt){const sp=wSpd();w.tt+=dt;if(w.sayT>0)w.sayT-=dt;if(w.cd>0)w.cd-=dt;w.walking=false;w.working=false;
 if(w.k=='asst'){w.at-=dt;if(w.at<=0){w.at=2.5;const m=autoClaim();if(m){w.say=m;w.sayT=2.2}}}
 if(w.job){const j=w.job;
  if(j.valid&&!j.valid()){if(j.cancel)j.cancel();w.job=null;return}
  const dx=j.tx-w.x,dy=j.ty-w.y,d=Math.hypot(dx,dy);
  if(d>.1)mv(w,dx,dy,d,sp*dt);
  else if(j.until){w.working=true;if(j.until()){w.job=null;if(j.act)j.act()}}
  else{j.wait-=dt;if(j.wait<=0){w.job=null;if(j.act)j.act()}}
  return}
 w.idleT-=dt;if(w.idleT<=0){w.idleT=.6;if(pickJob(w))return}
 const d=Math.hypot(w.home[0]-w.x,w.home[1]-w.y);if(d>.1)mv(w,w.home[0]-w.x,w.home[1]-w.y,d,sp*dt)}
function pickJob(w){return({buyer:jobBuy,mech:jobMech,stage:jobStage,sales:jobSales,mkt:jobMkt,asst:()=>false})[w.k](w)}
function jobBuy(w){if(S.cars.length>=S.cap)return false;let best=null,bs=-1e18;
 if(T.st=='park')S.auct.forEach(a=>{if(a.claim||a.price>S.money)return;const sc=a.v-a.price-.07*a.v*a.d;if(sc>bs){bs=sc;best={k:'a',a}}});
 S.trade.forEach(a=>{if(a.claim||a.price>S.money)return;const sc=a.v-a.price-.07*a.v*a.d;if(sc>bs){bs=sc;best={k:'t',a}}});
 if(!best)return false;const a=best.a,isA=best.k=='a';a.claim=true;
 const tx=isA?truckCarX(S.auct.indexOf(a))+.5:1.9;
 w.job={tx,ty:10.6,wait:.8,valid:()=>isA?(S.auct.includes(a)&&T.st=='park'):S.trade.includes(a),cancel:()=>{a.claim=false},act:()=>{a.claim=false;if(isA)buyAuct(a.id);else acceptTrade(a.id);w.say='Đã mua '+MD[a.mi].n;w.sayT=2}};return true}
function jobMech(w){const att=S.cars.find(c=>c.st=='rep'&&!c.worker);
 if(att){att.worker=true;w.job={tx:RX+1.05,ty:att.y+.15,wait:0,until:()=>att.st!='rep',cancel:()=>{att.worker=false},act:()=>{att.worker=false;w.say='Sửa xong!';w.sayT=1.8}};return true}
 if(freeBay()<0)return false;const c=S.cars.find(c=>c.st=='inv'&&!c.claim&&c.d>0&&S.money>=repCost(c));if(!c)return false;c.claim=true;
 w.job={tx:DOORX+.9,ty:10.5,wait:.6,valid:()=>c.st=='inv',cancel:()=>{c.claim=false},act:()=>{c.claim=false;const b=freeBay();if(b>=0)sendRepair(c,b)}};return true}
function jobStage(w){if(freeSale()<0)return false;const c=S.cars.find(c=>c.st=='inv'&&!c.claim&&c.d==0);if(!c)return false;c.claim=true;
 w.job={tx:DOORX-.9,ty:10.5,wait:.6,valid:()=>c.st=='inv',cancel:()=>{c.claim=false},act:()=>{c.claim=false;const i=freeSale();if(i>=0)sendDisplay(c,i)}};return true}
function jobSales(w){const c=S.cars.find(c=>c.st=='sale'&&c.offer>0&&!c.claim);if(!c)return false;c.claim=true;
 w.job={tx:c.x+.75,ty:c.y+.95,wait:1.1,valid:()=>S.cars.includes(c)&&c.st=='sale'&&c.offer>0,cancel:()=>{c.claim=false},act:()=>{c.claim=false;if(c.offer>0){sell(c,c.offer);w.say='Chốt đơn!';w.sayT=1.8}}};return true}
function jobMkt(w){if(w.cd>0||S.leaf<=0||!S.cars.some(c=>c.st=='sale')||cust.length>=S.saleN)return false;
 w.job={tx:R(1,8),ty:10.5,wait:1.2,act:()=>{useLeaf(true);w.cd=6;w.say='Phát tờ rơi!';w.sayT=1.8}};return true}
function autoClaim(){let m='';
 S.quests.forEach((q,i)=>{if(!q.done&&q.have>=q.need){claimQ(i);m='📋 Nhận thưởng nhiệm vụ'}});
 if(S.quests.every(q=>q.done)){newQ();m=m||'📋 Nhiệm vụ mới'}
 if(Date.now()-S.daily>=864e5){claimD();m='🎁 Nhận quà ngày'}
 if(S.spinT<=0){S.spinT=600;wres=spinReward();m='🎡 '+wres}
 return m}

/* ===================== CẬP NHẬT ===================== */
function follow(o,dt,spd){if(!o.path||!o.path.length)return true;const tx=o.path[0][0],ty=o.path[0][1],dx=tx-o.x,dy=ty-o.y,d=Math.hypot(dx,dy),s=spd*dt;
 if(d<=s){o.x=tx;o.y=ty;o.path.shift();return o.path.length==0}
 const ax=Math.abs(dx)>Math.abs(dy);o.dir=ax?'x':'y';o.fwd=(ax?dx:dy)>0?1:-1;o.x+=dx/d*s;o.y+=dy/d*s;return false}
function tick(dt){
 S.wLeft-=dt;if(S.wLeft<=0){S.wSun=!S.wSun;S.wLeft=S.wSun?300:120;toast(S.wSun?'☀️ Trời nắng, khách đông gấp đôi!':'🌧 Trời mưa, khách ít đi.')}
 if(S.leaf<10){S.leafT+=dt;if(S.leafT>=25){S.leaf++;S.leafT=0}}
 S.spinT=Math.max(0,S.spinT-dt);
 S.tradeT-=dt;if(S.tradeT<=0){S.tradeT=45;if(S.trade.length<3)S.trade.push(genTrade())}
 /* xe tải */
 if(T.st=='away'){if(!S.auct.length){S.auctT-=dt;if(S.auctT<=0){S.auct=genAuct();T.st='in';T.x=-7;T.t=0}}}
 else if(T.st=='in'){T.x+=4*dt;if(T.x>=TRUCKX){T.x=TRUCKX;T.st='park';T.t=0;toast('🚚 Xe tải đã tới bãi!');snd(300,.2,'square')}}
 else if(T.st=='park'){T.t+=dt;if(!S.auct.length||T.t>150)T.st='out'}
 else if(T.st=='out'){T.x+=4*dt;if(T.x>18){T.st='away';S.auct=[];S.auctT=45}}
 /* xe */
 S.cars.forEach(c=>{
  if(c.st=='move'){if(follow(c,dt,3.4)){c.st=c.after;c.dir='y';c.fwd=1;if(c.st=='rep'){c.p=0;c.worker=false}if(c.st=='inv'){c.x=DOORX;c.y=9.9}}}
  else if(c.st=='rep'){c.p+=dt/c.rt*(c.worker?2.2*(1+.15*S.spd):1);if(c.p>=1){c.d=0;c.p=0;spark(c.x,c.y);ev('repair');addXp(5);snd(1000,.1,'triangle');toGarage(c)}}
  if((c.st=='sale'||c.st=='rep')&&c.d>=3){c.sm=(c.sm||0)-dt;if(c.sm<=0){c.sm=.45;const p=P(c.x+.25,c.y-.1,26);parts.push({k:'smoke',x:p[0],y:p[1],vx:4,vy:-16,t:0,l:1.6})}}});
 G.forEach(g=>follow(g,dt,3.8));G=G.filter(g=>g.path&&g.path.length);
 /* khách */
 S.cT-=dt;if(S.cT<=0){const m=(1+.15*S.sign)*(S.wSun?1.8:.6);S.cT=13/m*R(.7,1.3);spawnCust()}
 cust.forEach(k=>{k.tt+=dt;if(k.sayT>0)k.sayT-=dt;k.walking=false;const c=S.cars.find(c=>c.id==k.car);
  if(k.st=='walk'){if(!c||c.st!='sale'){k.st='leave';return}
   const tx=c.x-.8,ty=c.y+1,dx=tx-k.x,dy=ty-k.y,d=Math.hypot(dx,dy);
   if(d<.1){k.st='wait';k.pat=0;c.offer=Math.round(ask(c)*R(.9,1.06));k.say=pick(PH);k.sayT=3;snd(660,.08)}else mv(k,dx,dy,d,1.7*dt)}
  else if(k.st=='wait'){k.pat+=dt;if(!c||c.st!='sale'){k.st='leave';return}if(k.pat>28){c.offer=0;k.st='leave';k.say='Thôi để lần sau!';k.sayT=2}}
  else if(k.st=='happy'){k.hp-=dt;if(k.hp<=0)k.st='leave'}

function plusI(x,y,t){const p=P(x,y,0),a=.5+.25*Math.sin(t*3);C.strokeStyle=`rgba(255,255,255,${a})`;C.lineWidth=2.5;C.beginPath();C.ellipse(p[0],p[1],14,7,0,0,6.283);C.stroke();C.beginPath();C.moveTo(p[0]-6,p[1]);C.lineTo(p[0]+6,p[1]);C.moveTo(p[0],p[1]-3);C.lineTo(p[0],p[1]+3);C.stroke()}
function drawParts(){parts.forEach(p=>{const f=p.t/p.l;
 if(p.k=='coin'){circ(p.x,p.y,3.4,'#e0a800');circ(p.x,p.y,2.6,'#ffd54a');circ(p.x-.8,p.y-.8,1,'#fff3b0')}
 else if(p.k=='text'){C.globalAlpha=Math.max(0,1-f);C.font='800 14px system-ui';C.textAlign='center';C.textBaseline='middle';C.lineWidth=3;C.strokeStyle='#3a2a00';C.strokeText(p.s,p.x,p.y);C.fillStyle='#fff176';C.fillText(p.s,p.x,p.y);C.globalAlpha=1}
 else if(p.k=='star'){C.globalAlpha=Math.max(0,Math.sin(f*Math.PI));C.font='14px system-ui';C.textAlign='center';C.textBaseline='middle';C.fillText('✨',p.x,p.y);C.globalAlpha=1}
 else if(p.k=='smoke'){C.globalAlpha=.5*(1-f);circ(p.x,p.y,3+f*7,'#777');C.globalAlpha=1}})}

/* ===================== VẼ: KHUNG HÌNH ===================== */
const cv=$('cv'),ctx=cv.getContext('2d'),cam={x:0,y:0,z:.7};let D=1;
function clampCam(){const cx=(innerWidth/2-cam.x)/cam.z,cy=(innerHeight/2-cam.y)/cam.z,nx=clamp(cx,-260,260),ny=clamp(cy,60,340);cam.x=innerWidth/2-nx*cam.z;cam.y=innerHeight/2-ny*cam.z}
function zoomAt(mx,my,nz){nz=clamp(nz,.5,1.5);const wx=(mx-cam.x)/cam.z,wy=(my-cam.y)/cam.z;cam.z=nz;cam.x=mx-wx*nz;cam.y=my-wy*nz;clampCam()}
function rs(){D=Math.min(devicePixelRatio||1,2);cv.width=innerWidth*D;cv.height=innerHeight*D}
addEventListener('resize',()=>{rs();clampCam()});rs();
cam.z=clamp(innerWidth/520,.55,1.1);cam.x=innerWidth/2-10*cam.z;cam.y=innerHeight/2-205*cam.z;clampCam();
const toS=(gx,gy,z)=>{const p=P(gx,gy,z);return[cam.x+p[0]*cam.z,cam.y+p[1]*cam.z]};
function tag(x,y,txt,bg,fg,size){C.font='800 '+size+'px system-ui';const w=C.measureText(txt).width+12,h=size+8;C.fillStyle='rgba(0,0,0,.25)';rr(x-w/2+1,y-h+2,w,h,h/2);C.fillStyle=bg;rr(x-w/2,y-h,w,h,h/2);C.fillStyle=fg;C.textAlign='center';C.textBaseline='middle';C.fillText(txt,x,y-h/2+1)}
function overlay(){ctx.setTransform(D,0,0,D,0,0);C=ctx;const t=performance.now()/1000;
 S.cars.forEach(c=>{
  if(c.st=='sale'){const q=toS(c.x,c.y,38);tag(q[0],q[1],(c.d>0?'🔧':'')+'$'+fmt(ask(c)),'#ffffff','#222',11);
   if(c.offer){const b=1+Math.sin(t*6)*.06;tag(q[0],q[1]-24,'💰 '+fmt(c.offer),'#ffe066','#222',12*b)}}
  else if(c.st=='rep'){const q=toS(c.x,c.y,34);C.fillStyle='rgba(0,0,0,.6)';rr(q[0]-20,q[1]-6,40,7,3);C.fillStyle='#43d36a';rr(q[0]-19,q[1]-5,Math.max(1,38*Math.min(1,c.p)),5,2)}});
 cust.forEach(k=>{if(k.sayT>0){const q=toS(k.x,k.y,34);tag(q[0],q[1],k.say,'#ffffff','#222',10)}});
 W.forEach(w=>{const q=toS(w.x,w.y,36);C.font='13px system-ui';C.textAlign='center';C.textBaseline='middle';C.fillStyle='#fff';C.fillText(ICON[w.k],q[0],q[1]-5);if(w.sayT>0)tag(q[0],q[1]-14,w.say,'#fff7d6','#222',10)});
 if(!S.wSun){C.fillStyle='rgba(30,50,90,.22)';C.fillRect(0,0,innerWidth,innerHeight);C.strokeStyle='rgba(210,225,255,.55)';C.lineWidth=1;C.beginPath();
  for(let i=0;i<50;i++){const x=(i*97+t*40)%innerWidth,y=(i*61+t*420)%innerHeight;C.moveTo(x,y);C.lineTo(x-3,y+12)}C.stroke()}}
function frame(){
 ctx.setTransform(D,0,0,D,0,0);ctx.fillStyle='#63b048';ctx.fillRect(0,0,innerWidth,innerHeight);
 ctx.setTransform(D*cam.z,0,0,D*cam.z,D*cam.x,D*cam.y);C=ctx;
 ctx.drawImage(stat,GX0,GY0,GW,GH);slotMarks();
 const E=[];
 TR.forEach(t=>E.push([t[0]+t[1],()=>drawTree(t[0],t[1],t[2],t[3])]));
 E.push([19.9,drawGarage],[15.9,()=>drawPost(5.7)],[19.3,()=>drawPost(9.1)],[17.6,drawBoard],[11.3,drawShopSign]);
 if(T.st!='away')E.push([T.x+1+ROADY,drawTruck]);
 S.cars.forEach(c=>{if(c.st!='inv')E.push([c.x+c.y,()=>drawCar(c.x,c.y,0,c.dir,c.mi,c.col,c.d,c.fwd)])});
 G.forEach(c=>E.push([c.x+c.y,()=>drawCar(c.x,c.y,0,c.dir,c.mi,c.col,0,c.fwd)]));
 cust.forEach(k=>E.push([k.x+k.y,()=>person(k.x,k.y,k)]));
 W.forEach(w=>E.push([w.x+w.y,()=>person(w.x,w.y,w)]));
 E.sort((a,b)=>a[0]-b[0]);E.forEach(e=>e[1]());
 drawParts();overlay()}

/* ===================== ĐIỀU KHIỂN ===================== */
function tap(px,py){const wx=(px-cam.x)/cam.z,wy=(py-cam.y)/cam.z,G2=z=>{const y=wy+z;return[(wx/32+y/16)/2,(y/16-wx/32)/2]};
 const h=G2(14);let gx=h[0],gy=h[1],best=null,bd=1.15;
 S.cars.forEach(c=>{if(c.st!='sale'&&c.st!='rep')return;const d=Math.hypot(gx-c.x,(gy-c.y)*.8);if(d<bd){bd=d;best=c}});
 if(best){const c=best;if(c.st=='sale'){if(c.offer)sell(c,c.offer);else go(()=>mCar(c.id))}else toast('🔧 Đang sửa '+MD[c.mi].n+': '+Math.round(c.p*100)+'%');return}
 if(T.st=='park'&&gy>10.4&&gy<12.8&&gx>T.x-2&&gx<T.x+3.3){go(mAuct);return}
 if(gx>9.2&&gx<12.4&&gy>8.9&&gy<10.5){go(mGarage);return}
 const g0=G2(0);gx=g0[0];gy=g0[1];
 for(let i=0;i<9;i++)if(Math.abs(gx-sx(i))<.9&&Math.abs(gy-sy(i))<1.1){if(i>=S.saleN){toast('Ô trưng bày đang khóa.');go(mMap)}else go(mGarage);return}
 for(let i=0;i<3;i++)if(Math.abs(gx-RX)<.9&&Math.abs(gy-ry(i))<1.1){if(i>=S.repN){toast('Ô sửa xe đang khóa.');go(mMap)}else go(mGarage);return}}
const ptrs=new Map();let drag=null,pin=null,moved=false;
cv.addEventListener('pointerdown',e=>{try{cv.setPointerCapture(e.pointerId)}catch(_){}ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;
 if(ptrs.size==2){const v=[...ptrs.values()];pin={d:Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y),z:cam.z};drag=null}
 else drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y}});
cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size==2&&pin){const v=[...ptrs.values()],d=Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y);zoomAt((v[0].x+v[1].x)/2,(v[0].y+v[1].y)/2,pin.z*d/pin.d);moved=true}
 else if(drag&&ptrs.size==1){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>8)moved=true;if(moved){cam.x=drag.cx+dx;cam.y=drag.cy+dy;clampCam()}}});
function ptrUp(e){const was=ptrs.size;ptrs.delete(e.pointerId);if(was==1&&!moved&&drag)tap(e.clientX,e.clientY);if(ptrs.size<2)pin=null;if(!ptrs.size)drag=null}
cv.addEventListener('pointerup',ptrUp);cv.addEventListener('pointercancel',ptrUp);
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,cam.z*(e.deltaY<0?1.1:.9))},{passive:false});

/* ===================== KHỞI ĐỘNG ===================== */
renderStatic();rebuildStaff();
W.forEach((w,i)=>{w.x=w.home[0];w.y=w.home[1]});
let last=performance.now(),hT=0;
function loop(t){const dt=Math.min(.1,(t-last)/1000);last=t;tick(dt);frame();hT-=dt;if(hT<=0){hT=.25;hud()}requestAnimationFrame(loop)}
hud();requestAnimationFrame(loop);
addEventListener('pagehide',save);
</script></body></html>
